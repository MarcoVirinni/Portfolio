<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marco Virinni - Proyectos</title>

<link rel="icon" href="./assets/fotoPerfil2025.jpg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
body { background:#f8f9fa; font-family:'Segoe UI'; }

.proyectos {
  padding:50px;
  background-size:cover;
  position:relative;
  color:white;
}

.proyectos::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.65);
}

.container { position:relative; z-index:1; }

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:15px;
}

.tech-filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:20px;
}

.tech-filters input{ display:none; }

.tech-filters label{
  cursor:pointer;
  color:#ffc107;
  border:1px solid #ffc107;
  padding:6px 12px;
  border-radius:20px;
  background:rgba(255,193,7,0.15);
  font-weight:600;
  transition:.25s;
}

.tech-filters input:checked + label{
  background:#0d6efd;
  color:white;
  border-color:#0d6efd;
}

/* CARDS */
.project-card{
  background:white;
  color:#212529;
  border-radius:16px;
  padding:18px;
  height:100%;
  transition:.3s;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.project-card:hover{
  transform:translateY(-6px);
  box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

.year-title{
  margin-top:30px;
  font-weight:bold;
  font-size:1.4rem;
  border-left:5px solid #0d6efd;
  padding-left:10px;
}

.tech-badge{ margin:2px; font-size:0.75rem; }

</style>
</head>

<body>

<section class="proyectos text-center">
<div class="container">

<h1>Proyectos Realizados</h1>

<div class="filters">
<input id="filterInput" class="form-control w-50" placeholder="Buscar...">
<select id="roleSelect" class="form-select w-25">
<option value="">Todos los Roles</option>
</select>
<button id="clearBtn" class="btn btn-outline-light">Limpiar</button>
</div>

<div id="techFilters" class="tech-filters"></div>

<p id="resultsCount"></p>

<div id="projectsContainer" class="row g-4"></div>

</div>
</section>

<script>

// 🔥 MAP ROLES (mejorado)
function mapRole(role){
  const r = role.toLowerCase();
  if(r.includes('scrum')) return 'Management';
  if(r.includes('data')) return 'Data';
  if(r.includes('mobile')) return 'Mobile';
  if(r.includes('full')) return 'Full Stack';
  if(r.includes('front')) return 'Frontend';
  if(r.includes('back')) return 'Backend';
  if(r.includes('java')) return 'Backend';
  if(r.includes('python')) return 'Backend';
  return 'Other';
}

// 🔥 DATA ORIGINAL COMPLETA (NO TOCADA)
const allProjects = [
  {anio:2023, fecha:"Enero", nombre:"Liga de Hockey -- MindHub", rol:"FrontEnd Developer", tecnologias:["HTML","CSS","BOOTSTRAP"], descripcion:"Bootcamp Front End de página de Liga de Hockey. Sitio Web estático.", link:"https://MarcoVirinni.github.io/MightyDucksHockeyLeague/index.html"},
  {anio:2023, fecha:"Febrero y Marzo", nombre:"Amazing Events -- MindHub", rol:"FrontEnd Developer", tecnologias:["HTML","CSS","BOOTSTRAP","JS"], descripcion:"Bootcamp Front End de página de Eventos. (MindHub retiro el acceso CORS).", link:"https://MarcoVirinni.github.io/Amazing_events/index.html"},
  {anio:2023, fecha:"Agosto a Octubre", nombre:"Homebaking -- MindHub", rol:"BackEnd Developer", tecnologias:["Java","Spring Boot","Gradle","PostgreSQL"], descripcion:"Bootcamp Back End de Homebanking brindado por Mindhub Argentina Programa.", link:"https://github.com/MarcoVirinni/homeBanking"},
  {anio:2023, fecha:"Octubre a Diciembre", nombre:"Biblioteca -- SXXI & NEORIS", rol:"BackEnd Developer", tecnologias:["Java","Gradle","GUI","MySQL"], descripcion:"Programación orientada a objetos. Registro y validaciones.", link:"https://github.com/MarcoVirinni/BibliotecaJava/tree/Entrega/src/main/java/biblioteca"},
  {anio:2023, fecha:"Octubre a Diciembre", nombre:"JAVA UTN Argentina Programa", rol:"Java Developer", tecnologias:["Java"], descripcion:"Data Access Object Pattern Design - Trabajo Grupal", link:"https://github.com/ProyectoJavaUtn/TrabajoPractico"},
  {anio:2023, fecha:"Proyecto Anual", nombre:"PlanetSuperheroes. E-commerce -- ISPC", rol:"Full Stack Developer", tecnologias:["JavaScript","Python","MySQL"], descripcion:"Proyecto integrador grupal del 1° año del ISPC. POO, persistencia MySQL, UML/DER, SCRUM. Deploy con github pages.", link:"https://ispc-desarrolladores-2-0.github.io/PFS-Ecommerce-2023/"},
  {anio:2024, fecha:"Enero-Febrero", nombre:"Educaflex (Simulación No Country)", rol:"BackEnd Developer", tecnologias:["Java","SpringBoot","JWT"], descripcion:"Simulación Laboral en No Country. Sitio web para clases online.", link:"https://c16-35-m-java-evif.onrender.com/"},
  {anio:2024, fecha:"Marzo-Abril", nombre:"FooDelivery (Simulación No Country)", rol:"FrontEnd Developer", tecnologias:["Angular 17","RxJS","Signals","JWT"], descripcion:"Simulación Laboral: app de pedidos y gestión para restaurantes y usuarios.", link:"https://www.youtube.com/watch?v=5soQRCvfhuw"},
  {anio:2024, fecha:"Abril-Julio", nombre:"E-commerce de Venta de Cómics -- ISPC", rol:"Full Stack Developer", tecnologias:["Angular","Django REST Framework","MySQL"], descripcion:"Proyecto integrador del 2° año ISPC. Persistencia en MySQL, UML/DER, SCRUM.", link:"https://www.youtube.com/watch?v=kNJ0ySpz3XU&t=1s"},
  {anio:2024, fecha:"Agosto-Noviembre", nombre:"Musiverse -- ISPC", rol:"Python Developer / Database Developer", tecnologias:["Python","SQL","CRUD"], descripcion:"Sistema de gestión musical y control de accesos.", link:"#"},
  {anio:2024, fecha:"Agosto-Diciembre", nombre:"PlanetSuperheroes Mobile (2024)", rol:"Mobile Developer", tecnologias:["Android Studio","Java","Kotlin","Django REST","MySQL"], descripcion:"App Android con registro, login, carrito, historial y backend en Django REST.", link:"https://drive.google.com/file/d/1vSrO2fAua-KClXLYzwbCXReoqYzCLbDK/view"},
  {anio:2025, fecha:"Enero – Marzo", nombre:"Al Parque – Red Social", rol:"Full Stack Developer", tecnologias:["Angular 19","React","Django REST","PostgreSQL","Cloudinary","Python"], descripcion:"Red social con tres APIs, JWT, Cloudinary y gráfico IMC con Pandas/Matplotlib.", link:"https://al-parque.vercel.app/home"},
  {anio:2025, fecha:"Abril – Julio", nombre:"Estadísticas con React", rol:"FrontEnd Developer", tecnologias:["React","Vite","Tailwind","Axios","Recharts"], descripcion:"App React para explorar productos desde API pública con filtros y estadísticas.", link:"https://analisisestadisticosconreact.netlify.app/"},
  {anio:2025, fecha:"Abril – Julio", nombre:"PlanetSuperheroes — E-commerce Web App", rol:"Full Stack Developer / Scrum Master", tecnologias:["Angular 17","Python","Django REST","Cloudinary","Mercado Pago","MySQL"], descripcion:"Proyecto final Tecnicatura: integración Mercado Pago, refactor backend, despliegue Render/Vercel.", link:"https://planetsuperheroes.vercel.app/home"},
  {anio:2025, fecha:"Abril – Julio", nombre:"PlanetSuperheroes Mobile (2025)", rol:"Mobile Developer", tecnologias:["Android Studio","Java","Kotlin","Django REST","Cloudinary"], descripcion:"Evolución del mobile 2024 con mejoras y notificaciones.", link:"https://github.com/Web-Developers2-0/2025-Practica_Profesionalizante/tree/main/mobile"},
  {anio:2025, fecha:"Junio", nombre:"Cancionero de Rock", rol:"Mobile Developer", tecnologias:["Android Studio","Java","Kotlin"], descripcion:"App para banda con acordes y reproductor offline.", link:"https://youtube.com/shorts/_uJHPZEggQ4?feature=share"},
  {anio:2025, fecha:"Abril – Julio", nombre:"Cluster Fusion - Análisis Ataques Cardíacos", rol:"Data Analyst", tecnologias:["Python","Pandas","Matplotlib","Scikit-learn"], descripcion:"EDA, limpieza, visualización y perfiles predictivos aplicados a salud.", link:"https://github.com/ISPC-Cluster-Fusion/Modulo_Analista_de_Datos_2025/tree/main"},
  {anio:2025, fecha:"Agosto", nombre:"Voluntarios Cáritas Iglesia San José", rol:"BackEnd Developer", tecnologias:["Python","Django","Hostinger","Ubuntu","Figma"], descripcion:"Digitalización del registro de beneficiarios; VPS en Hostinger y panel Django Admin.", link:"https://www.parroquiasanjose-caritas.store/admin/login/"},
  {anio:2024, fecha:"Abril 2024 - Agosto 2025", nombre:"Portfolio Personal", rol:"FrontEnd Developer", tecnologias:["HTML","CSS","JS","Bootstrap"], descripcion:"Portfolio personal en evolución. Pendiente modo oscuro y multilanguage.", link:"https://www.youtube.com/watch?v=n6qZBaYMzes&feature=youtu.be"}
];

// 🔥 resto igual (render cards)
const container = document.getElementById('projectsContainer');
const searchInput = document.getElementById('filterInput');
const roleSelect = document.getElementById('roleSelect');
const techFiltersWrap = document.getElementById('techFilters');

[...new Set(allProjects.map(p=>mapRole(p.rol)))]
.forEach(r=> roleSelect.innerHTML += `<option>${r}</option>`);

[...new Set(allProjects.flatMap(p=>p.tecnologias))]
.forEach(t=>{
  techFiltersWrap.innerHTML += `<input type="checkbox" id="${t}" value="${t}"><label for="${t}">${t}</label>`;
});

function render(){
  container.innerHTML='';
  let count=0;

  const terms = searchInput.value.toLowerCase().split(' ').filter(Boolean);
  const role = roleSelect.value;
  const techs = [...document.querySelectorAll('.tech-filters input:checked')].map(c=>c.value);

  const years = [...new Set(allProjects.map(p=>p.anio))].sort((a,b)=>b-a);

  years.forEach(year=>{
    const filtered = allProjects.filter(p=>{
      if(p.anio!==year) return false;
      const text=(p.nombre+p.descripcion+p.tecnologias.join(' ')).toLowerCase();
      return terms.every(t=>text.includes(t))
        && (!role || mapRole(p.rol)===role)
        && (techs.length===0 || p.tecnologias.some(t=>techs.includes(t)));
    });

    if(filtered.length){
      container.innerHTML += `<div class="col-12"><div class="year-title">${year}</div></div>`;
      count+=filtered.length;

      filtered.forEach(p=>{
        container.innerHTML += `
        <div class="col-md-6 col-lg-4">
          <div class="project-card">

            <strong>${p.nombre}</strong><br>
            <small>${p.fecha}</small>

            <div class="mt-2">
              <span class="badge bg-primary">${mapRole(p.rol)}</span><br>
              <small class="text-muted">${p.rol}</small>
            </div>

            <div class="mt-2">
              ${p.tecnologias.map(t=>`<span class="badge bg-warning text-dark tech-badge">${t}</span>`).join('')}
            </div>

            <p class="mt-2">${p.descripcion}</p>

            <a href="${p.link}" target="_blank" class="btn btn-sm btn-primary">
              <i class="fas fa-external-link-alt"></i> Ver
            </a>

          </div>
        </div>`;
      });
    }
  });

  document.getElementById('resultsCount').textContent = `Mostrando ${count} proyectos`;
}

searchInput.addEventListener('input',render);
roleSelect.addEventListener('change',render);
document.addEventListener('change',e=>{
  if(e.target.matches('.tech-filters input')) render();
});

document.getElementById('clearBtn').onclick=()=>{
  searchInput.value='';
  roleSelect.value='';
  document.querySelectorAll('.tech-filters input').forEach(c=>c.checked=false);
  render();
};

render();

</script>

</body>
</html>
